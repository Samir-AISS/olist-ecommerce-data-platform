name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: olist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olist"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: olist
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit and integration tests
        run: uv run pytest -v
      - name: Load the sample end to end
        run: uv run python -m ingestion.load_raw --data-dir data/sample
