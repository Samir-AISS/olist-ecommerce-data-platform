name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: olist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olist"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: olist
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REQUIRE_DB: "1"
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run sqlfluff lint dbt/models dbt/macros dbt/tests dbt/analyses
      - name: Unit and integration tests
        run: uv run pytest -v
      - name: Load the sample into the raw schema
        run: uv run python -m ingestion.load_raw --data-dir data/sample
      - name: dbt build (models + tests) on the sample
        run: |
          uv run dbt deps
          uv run dbt build
      - name: Run the SQL analyses on the sample
        run: |
          uv run dbt compile --select "resource_type:analysis" --quiet
          uv run python scripts/run_analyses.py --output "$RUNNER_TEMP/findings.md"
      - name: Export the marts for Tableau
        run: uv run python scripts/export_marts.py --output-dir "$RUNNER_TEMP/exports"

  airflow-dag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIRFLOW_HOME: /tmp/airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Airflow (same version as the Docker image)
        run: |
          uv venv --python 3.11 /tmp/airflow-venv
          VIRTUAL_ENV=/tmp/airflow-venv uv pip install "apache-airflow==3.3.2" \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.11.txt
      - name: DAG loads without import errors and has its 9 tasks
        run: |
          airflow=/tmp/airflow-venv/bin/airflow
          $airflow db migrate > /dev/null
          errors=$($airflow dags list-import-errors -o json 2>/dev/null | tail -n 1)
          echo "import errors: $errors"
          test "$errors" = "[]"
          tasks=$($airflow tasks list olist_daily 2>/dev/null | grep -c .)
          echo "tasks: $tasks"
          test "$tasks" -eq 9
