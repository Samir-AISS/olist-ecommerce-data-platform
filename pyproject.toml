[project]
name = "olist-ecommerce-data-platform"
version = "0.1.0"
description = "Analytics Engineering & BI on the Olist Brazilian e-commerce dataset"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dbt-postgres>=1.9",
    "kagglehub>=0.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "sqlfluff>=3.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a running PostgreSQL (make up)"]
