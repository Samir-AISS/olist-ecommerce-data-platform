name: olist
version: "1.0.0"
profile: olist

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

models:
  olist:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  olist:
    +schema: seeds

snapshots:
  olist:
    +schema: snapshots

vars:
  # Days re-processed by the incremental fact table to catch late status updates
  incremental_lookback_days: 30
